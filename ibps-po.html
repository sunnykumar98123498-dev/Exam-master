<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Master - IBPS PO</title>

<style>
body {
  font-family: Arial;
  background: #f3f6fa;
  padding: 15px;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 15px;
}

button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  background: #1565c0;
  color: white;
  font-size: 16px;
}

.option {
  background: #e3f2fd;
  color: black;
}

#test {
  display: none;
}

#result {
  display: none;
}
</style>
</head>

<body>

<div class="box" id="start">
  <h1>Exam Master</h1>
  <h2>IBPS PO Mock Test</h2>

  <p>Maths: 35 Questions — 20 Minutes</p>
  <p>Reasoning: 35 Questions — 20 Minutes</p>
  <p>English: 30 Questions — 20 Minutes</p>

  <button onclick="startTest()">Start Test / टेस्ट शुरू करें</button>
</div>

<div id="test">

  <div class="box">
    <h2 id="question"></h2>
    <div id="options"></div>
  </div>

  <button onclick="nextQuestion()">Next / अगला</button>

</div>

<div class="box" id="result">
  <h2>Test Completed / टेस्ट पूरा हुआ</h2>
  <p id="score"></p>
  <button onclick="location.reload()">Restart / फिर से शुरू करें</button>
</div>

<script>

const questions = [
  {
    q: "25% of 240 is कितने होगा?",
    options: ["40", "50", "60", "80"],
    answer: 2
  },
  {
    q: "3 + 5 × 2 = ?",
    options: ["16", "13", "10", "12"],
    answer: 1
  },
  {
    q: "भारत की राजधानी क्या है?",
    options: ["मुंबई", "पटना", "नई दिल्ली", "रांची"],
    answer: 2
  },
  {
    q: "Choose the synonym of Happy.",
    options: ["Sad", "Joyful", "Angry", "Weak"],
    answer: 1
  },
  {
    q: "Find the odd one: Dog, Cat, Cow, Rose.",
    options: ["Dog", "Cat", "Cow", "Rose"],
    answer: 3
  }
];

let current = 0;
let score = 0;
let selected = -1;

function startTest() {
  document.getElementById("start").style.display = "none";
  document.getElementById("test").style.display = "block";
  showQuestion();
}

function showQuestion() {
  selected = -1;

  document.getElementById("question").innerText =
    "Q" + (current + 1) + ". " + questions[current].q;

  let html = "";

  questions[current].options.forEach(function(option, index) {
    html +=
      '<button class="option" onclick="selectAnswer(' +
      index +
      ')">' +
      option +
      "</button>";
  });

  document.getElementById("options").innerHTML = html;
}

function selectAnswer(index) {
  selected = index;
}

function nextQuestion() {
  if (selected === -1) {
    alert("पहले कोई option चुनें।");
    return;
  }

  if (selected === questions[current].answer) {
    score++;
  }

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("test").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("score").innerText =
      "आपका Score: " + score + " / " + questions.length;
  }
}

</script>

</body>
</html>
